name: CI Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Run Linter
        run: npm run lint --workspaces --if-present
        
      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
      
      - name: Dependency Scanning
        run: npm audit --audit-level=high
        
      - name: Run Unit Tests
        run: npm run test --workspaces --if-present
        
      - name: CD Placeholder - Build Image
        run: echo "Docker build and AWS ECR push commands will be configured here"
        
      - name: CD Placeholder - Deploy to AWS Preview
        run: echo "ECS Fargate preview deployment commands will be configured here"
